name: pytest-coverage

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.11

    - name: Install dependencies
      run: uv sync

    - name: Install test dependencies
      run: uv pip install ".[test]"

    - name: Pytest with coverage
      run: uv run coverage run -m pytest --nf

    - name: Build coverage report
      run: uv run coverage report -m --fail-under=100

    - name: Coverage Badge
      run: uv run coverage-badge -f -o coverage.svg

    - name: Verify Changed files
      uses: tj-actions/verify-changed-files@v19
      id: verify-changed-files
      with:
        files: coverage.svg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.11

    - name: Install dependencies
      run: uv sync

    - name: Retrieve version
      run: echo "APP_VERSION=$(uv version --short)" >> "$GITHUB_ENV"

    - name: Retrieve commit message
      run: echo "COMMIT_MSG=$(git log -1 --pretty=format:'%s')" >> "$GITHUB_ENV"

    - name: Build
      run: uv build

    # PyPI Trusted Publishing (OIDC): this repository and workflow must be
    # registered as a trusted publisher for the `ssvc` project on PyPI
    # (https://pypi.org/manage/project/ssvc/settings/publishing/). That is a
    # one-time setup step done in the PyPI UI, outside this repo. No API
    # token is stored or referenced here; `id-token: write` above plus
    # `uv publish` handle the OIDC exchange.
    - name: Publish to PyPI
      run: uv publish

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: |
          ./dist/ssvc-${{ env.APP_VERSION }}.tar.gz
          ./dist/ssvc-${{ env.APP_VERSION }}-py3-none-any.whl

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        gh release create "$RELEASE_TAG" \
          --title "Release v${APP_VERSION}" \
          --notes "$COMMIT_MSG" \
          "./dist/ssvc-${APP_VERSION}.tar.gz" \
          "./dist/ssvc-${APP_VERSION}-py3-none-any.whl"

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # setuptools 81 removed pkg_resources, which coverage-badge still
      # imports, so a major bump breaks the badge step after the tests have
      # already passed. pyproject.toml pins setuptools below 81 for that
      # reason, but Dependabot cannot read the comment explaining it and has
      # already raised the ceiling once. Drop this entry if coverage-badge is
      # ever replaced with something maintained.
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-major"]
